# 공개 저장소의 빌드·시험·(승인되면) 서명 — SignPath Foundation 은 이 Actions 가 공개 소스로 만든 산출물만 서명한다.
# 순서(anti1 2026-11-23): agent-desktop 빌드 → 해시 고정(screen_pin.py) → PyInstaller·Rust → 안쪽 exe 서명 → vpk pack → Setup 서명.
# agent-desktop.exe 는 고친 upstream 이라 서명하지 않는다(해시가 앱에 박힌다). SIGNPATH_* 가 없으면 서명 없이 만든다.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12.6" }
      - run: |
          python -m pip install --upgrade pip
          python -m pip install ".[desktop,workshop]" pytest
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    env:
      VADER_RUST: "1.99.1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12.6" }
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: "9.0.x" }
      - name: Toolchains
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          dotnet tool install -g vpk --version 1.2.161
          python -m venv .venv-desktop
          .venv-desktop\Scripts\python -m pip install --upgrade pip
          .venv-desktop\Scripts\python -m pip install ".[desktop,eonm,supply,gemini,claude,workshop]" typer==0.21.2 pyinstaller==6.22.3 velopack==1.2.161   # typer: PyInstaller 가 mcp.cli 를 모을 때 필요
      # 업데이트 피드 = 운영 웹(초대 키가 든 주소, 저장소 비밀 UPDATE_FEED_URL). GitHub 릴리스 주소는 쓰지 않는다 —
      # Velopack(ureq)이 release-assets 로 넘어갈 때 jwt 를 잃어 404 (0.1.37 에서 확인, 2026-11-25).
      # 태그 빌드만 피드를 넣고, 비밀이 없으면 멈춘다. main·PR 빌드는 업데이트가 꺼진 채로 만든다 (codex1).
      - name: Update feed (release tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          FEED: ${{ secrets.UPDATE_FEED_URL }}
        run: |
          if (-not $env:FEED) { throw 'UPDATE_FEED_URL secret is required for release builds' }
          $env:FEED | Out-File packaging\update_feed.txt -Encoding ascii -NoNewline
      - name: Build unsigned (exe + installer)
        shell: pwsh
        run: |
          $env:RUSTUP_TOOLCHAIN = '1.99.1'
          powershell -File packaging\build.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: vaderai-windows
          path: releases/
          if-no-files-found: error

  # 태그(v*)면 초안 릴리스로 올린다. 공개(발행)는 사람이 한다 — 먼저 releases.win.json 을 업데이트 키로 서명해
  # releases.win.json.sig 를 같은 릴리스에 올린 뒤에 (tools/update_sign.py). 서명 없는 업데이트는 앱이 받지 않는다.
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with: { name: vaderai-windows, path: releases }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" releases/* --draft --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "Draft — published after the update signature (.sig) is attached. Code signing policy: https://github.com/${GITHUB_REPOSITORY}/blob/main/CODE_SIGNING.md"
