[build-system]
# Python 배포판과 개발 환경에 가장 널리 갖춰진 백엔드라 별도 도구 선택을
# 강요하지 않는다.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaderai"
dynamic = ["version"]
description = "중간에 끊겨도, 다시 돌려도 중복 없이 이어지는 Windows 업무대행 RPA"
requires-python = ">=3.11"
# 코어는 서드파티 패키지를 쓰지 않는다. 룬이 자기 것을 가져온다 —
# 그래야 룬이 실제로 탈부착된다. tests/test_dependency_direction.py 가 지킨다.
dependencies = []

[project.optional-dependencies]
# 화면이 있는 VaderAI 에는 룬 제작 연결(mcp)도 같이 깐다 — 다른 PC 에서 버튼 한 번으로 연결되게.
# cryptography: 공유용 룬의 운영자 서명·확인 (vader/core/signing.py).
# pywinpty: 제작소 안 콘솔 (ConPTY 로 Claude Code·Codex 를 화면 안에서 띄운다).
# vodozemac: 메신저 종단간 암호 (Matrix Olm). 판 고정 — 올리면 저장된 세션이 열리는지 먼저 시험 (3a).
desktop = ["pywebview>=6.0,<7", "mcp>=1.20", "openpyxl>=3.1", "cryptography>=42", "pywinpty>=2.0; sys_platform == 'win32'", "pypdfium2>=4", "vodozemac==0.10.0", "pystray>=0.19"]
claude = ["anthropic>=0.49.0"]
gemini = ["google-genai>=1.0.0"]
# 룬별 묶음. 없이 설치해도 코어는 돌고 그 룬만 로드에 실패한다.
eonm = ["pywinauto>=0.6.9", "thefuzz[speedup]>=0.22.0", "pillow>=10"]
supply = ["pandas>=2.0", "openpyxl>=3.1", "xlrd>=2.0"]
# 룬 제작 MCP 서버 (Claude Code 에서 룬을 만든다). 시험의 엑셀 비교에 openpyxl.
workshop = ["mcp>=1.20", "openpyxl>=3.1"]

[project.scripts]
vaderai = "vader.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vader", "vader.*"]
exclude = ["tests*", "rune-packages*", "tools*", "wiki*"]

[tool.setuptools.dynamic]
# 버전 숫자는 vader/__init__.py 한 곳에만 둔다.
version = {attr = "vader.__version__"}

[tool.setuptools.package-data]
"vader.core" = ["workshop_guide.md"]
"vader.desktop" = ["assets/*.html", "assets/*.css", "assets/*.js", "assets/*.ico", "assets/*.png", "assets/vendor/xterm/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
