[package]
name = "vaderai"
version = "0.1.38"
edition = "2021"
description = "VaderAI 데스크톱 껍데기 — 창·트레이·대화상자. 업무는 파이썬 일꾼(vader/desktop/worker.py)."

[[bin]]
name = "VaderAI"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
velopack = "0.0"
tauri-winrt-notification = "0.7"
winreg = "0.55"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_IO",
] }

[profile.release]
lto = true
opt-level = "s"
strip = true
